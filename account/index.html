<body data-page="account">
<div class="wrap">
<script src="../js/layout.js"></script>
  <section id="tab-account" class="terms">
    <h2>アカウント</h2>
    <p class="upd">ログインしなくても、作る・投票する・パックを開けるはすべてできます。</p>
    <div class="field"><label for="aName">作者名（12文字まで）</label><input id="aName" maxlength="12" autocomplete="nickname" placeholder="ななしさん"></div>
    <h3>Googleアカウント</h3>
    <p id="aStatus"></p>
    <p><button class="btn" id="aGoogle">Googleと連携する</button> <button class="btn small" id="aLogout" hidden>ログアウト</button></p>
    <p class="hint">連携すると、集めたカードがどの端末でも見られるようになります。別の端末で連携済みのGoogleアカウントを選ぶと、そのアカウントに切り替わります。</p>
    <p><button class="btn small" data-back>もどる</button></p>
  </section>
</div>
